services:
  nsa-bot:
    build: .
    container_name: nsa-bot
    env_file: .env
    environment:
      NSA_DB_PATH: /data/nsa.db
      NSA_API_HOST: 0.0.0.0  # inside the container; the port below is only published on the box's localhost
    ports:
      - "127.0.0.1:8787:8787"  # agent API: reachable from this box only (put HTTPS in front to share it)
    volumes:
      - nsa-data:/data
    restart: unless-stopped
    # Shares the box with other services: cap memory and keep logs from filling the disk.
    mem_limit: 300m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nsa-data:
